[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    dataset: needs the participant dataset/ directory (skipped when absent)
    slow: full 518-case end-to-end run
    ocr: needs the tesseract binary
    live_llm: calls a real model API; opt-in via AUDIT_LIVE_LLM=1 and OPENAI_API_KEY
cache_dir = ../.pytest_cache
