name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_run:
        description: "Also audit all requests and validate output.csv (needs dataset/)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # CI never talks to a model provider: no keys are configured and LLM use is off.
  AUDIT_USE_LLM: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements-dev.txt
      - run: pip install ruff
      - name: Ruff lint
        working-directory: code
        run: ruff check . --output-format=github
      - name: Ruff format check
        working-directory: code
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/requirements-dev.txt
      - name: Install Tesseract (screenshot OCR)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Install dependencies
        run: pip install -r code/requirements-dev.txt
      - name: Unit, contract, validation, integration, regression and e2e tests
        run: python -m pytest code/tests -q --junitxml=test-results.xml -W ignore::DeprecationWarning
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements-dev.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: pip install -r code/requirements.txt
      - name: Evaluation workflow (tests -> run -> validate -> compare -> gates)
        env:
          FULL_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.full_run }}
        run: |
          if [ ! -f dataset/sample_output.csv ]; then
            echo "dataset/ not in repository: evaluation needs the official dataset (including deletion_rules.csv); skipped"
          elif [ "$FULL_RUN" = "true" ]; then
            python code/evaluation/main.py --full --require-dataset
            python code/evaluation/validate_submission.py --rerun
          else
            python code/evaluation/main.py --require-dataset
          fi
      - name: Upload predictions and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-run
          path: |
            runs/
            output.csv
          if-no-files-found: ignore
